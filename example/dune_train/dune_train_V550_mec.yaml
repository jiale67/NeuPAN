# wheeltec V550_mec 的 DUNE 训练配置。
#
# 跑法（在本目录下）:
#   cd /home/rjl/nav_ws/src/NeuPAN/example/dune_train
#   python3 dune_train_V550_mec.py
# 产物落在 example/model/ 下，训完把 .pth 路径填到 neupan_ros 那边的
# ~dune_checkpoint 参数。
#
# robot 段必须与 neupan_planner_V550_mec.yaml 的 robot 段**逐字一致**，
# 否则训出来的权重和运行时的 G/h 不匹配 —— 而且不会报错，只会静默算错碰撞距离。

robot:
  # DUNE 只用 length/width 算 G/h，kinematics 不参与训练。写 omni3 是为了跟
  # 运行时配置对齐，避免以后对照时产生疑问。
  #
  # 控制量从 (vx, vy) 改成 (vx, vy, w) **不需要重训 DUNE**: G/h 只由
  # length/width 决定，与控制量参数化无关。现有的
  # pretrain_V550_mec/model_5000.pth 继续有效。
  #
  # 注意 omni3 要求 max_speed/max_acce 是三元素，但训练路径不走
  # bound_su_constraints，这里不给这两项也能训（robot.__init__ 的默认值是 inf，
  # np.c_[[inf, inf]] 只有两行 -> 会触发 omni3 的三元素校验）。所以真要重训时
  # 要么把 kinematics 写回 'omni'，要么补上三元素的 max_speed/max_acce。
  # 已经补上了，见下面两行 —— 值无关紧要，训练不用它们。
  kinematics: 'omni3'
  max_speed: [1.0, 1.0, 1.0]
  max_acce: [1.0, 1.0, 2.0]
  length: 0.26
  width: 0.2446

train:
  direct_train: true
  data_size: 100000
  # limo/示例默认 [-25,-25,25,25]，那是给 1.6x2.0 那种大车的。V550 只有 0.26m，
  # 采样范围按车尺寸等比缩小到 ±4m，让样本集中在真正会用到的距离区间，
  # 否则绝大多数样本都是"离得很远"，近距离精度上不去。
  # ±4m 也覆盖了运行时 ~scan_range 的上限 8m 的一半，足够 MPC 的 5 步预测视野。
  data_range: [-4, -4, 4, 4]
  batch_size: 256
  epoch: 5000
  valid_freq: 250
  save_freq: 500
  lr: 5e-5
  lr_decay: 0.5
  decay_freq: 1500
